<!-- Candidate app header: same navy gradient and logo treatment as the admin sidebar (no product name shown to candidates).
     Optional: set `header_title` before including to show a page title on the right of the brand. -->
<header
    class="h-16 shrink-0 w-full z-30 flex items-center justify-between px-4 sm:px-8 bg-[linear-gradient(90deg,#1e3a8a,#172554)] text-blue-100 shadow-lg">
    <div class="flex items-center min-w-0">
        <div class="flex flex-col items-start">
            <img src="{{ url_for('static', filename='images/SBP-Logo.png') }}" alt="SBP Logo"
                class="h-7 w-auto grayscale brightness-200">
        </div>
        {% if header_title %}
        <span class="ml-5 pl-5 border-l border-white/20 text-white font-bold text-sm sm:text-base truncate">{{ header_title }}</span>
        {% endif %}
    </div>
    <span class="hidden sm:flex items-center text-xs font-bold text-blue-200">
        <i class="fa-solid fa-shield-halved mr-2"></i> Secure Online Assessment
    </span>
</header>
