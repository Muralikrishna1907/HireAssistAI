<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Assist AI - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Safely inject the background image here instead of inline -->
    <style>
        .custom-login-bg {
            background-image: url("{{ url_for('static', filename='images/login-bg.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>

<!-- Full-screen background using the custom class -->

<body
    class="custom-login-bg h-screen w-full flex font-sans antialiased text-slate-800 overflow-hidden selection:bg-blue-200">

    <!-- Empty spacer for the left side of the image (Desktop only) -->
    <div class="hidden md:block md:w-1/2 lg:w-[55%] h-full"></div>

    <!-- Form Container (Right side) -->
    <div
        class="w-full md:w-1/2 lg:w-[45%] h-full flex flex-col justify-center items-center p-8 lg:p-16 bg-white/95 md:bg-transparent backdrop-blur-md md:backdrop-blur-none z-10">

        <div class="w-full max-w-md">

            <!-- Mobile Logo -->
            <div class="md:hidden flex justify-center mb-8">
                <img src="{{ url_for('static', filename='images/SBP-Logo.png') }}" alt="SBP Logo" class="h-10 w-auto">
            </div>

            <!-- Header -->
            <div class="mb-10">
                <h2 class="text-3xl lg:text-4xl font-black text-slate-800 mb-3 tracking-tight">Welcome Back!</h2>
                <p class="text-slate-500 font-medium">Sign in to access your Hire Assist AI dashboard.</p>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div
                class="mb-6 px-4 py-3 rounded-lg flex items-center text-sm font-bold {% if category == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-200{% else %}bg-rose-50 text-rose-700 border border-rose-200{% endif %} shadow-sm">
                <i
                    class="fa-solid {% if category == 'success' %}fa-circle-check{% else %}fa-circle-exclamation{% endif %} mr-2"></i>
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <!-- Login Form -->
            <form method="POST" action="">
                <!-- Username -->
                <div class="mb-5">
                    <label class="block text-sm font-extrabold text-slate-700 mb-2">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-slate-400"></i>
                        </div>
                        <input type="text" name="username" placeholder="Enter your username" required
                            class="w-full pl-11 pr-4 py-3.5 bg-white border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm font-medium shadow-sm">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-8">
                    <label class="block text-sm font-extrabold text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" name="password" id="passwordField" placeholder="Enter your password"
                            required
                            class="w-full pl-11 pr-12 py-3.5 bg-white border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm font-medium shadow-sm">
                        <!-- Eye Icon for Toggle -->
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-slate-400 hover:text-slate-600 transition-colors"
                            onclick="togglePassword()">
                            <i id="eyeIcon" class="fa-solid fa-eye"></i>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full bg-[#0d6efd] hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center tracking-wide">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
                </button>
            </form>

            <!-- Footer Secure Access -->
            <div class="text-center text-xs font-bold text-slate-500 flex items-center justify-center mt-10">
                <i class="fa-solid fa-shield-halved mr-2 text-slate-400"></i> Secure access to your Hire Assist AI
                dashboard.
            </div>

        </div>
    </div>

    <!-- Script for Password Toggle -->
    <script>
        function togglePassword() {
            const passwordField = document.getElementById("passwordField");
            const eyeIcon = document.getElementById("eyeIcon");

            if (passwordField.type === "password") {
                passwordField.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passwordField.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }
    </script>

</body>

</html>
