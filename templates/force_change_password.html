<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Assist AI - Update Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body
    class="bg-slate-50 min-h-screen flex items-center justify-center font-sans antialiased text-slate-800 selection:bg-blue-200 p-4">

    <!-- Centered Auth Card -->
    <div
        class="bg-white w-full max-w-md p-8 sm:p-10 rounded-2xl shadow-xl border border-slate-200 text-center relative overflow-hidden">

        <!-- SBP Logo -->
        <img src="{{ url_for('static', filename='images/SBP-Logo.png') }}" alt="SBP Logo"
            class="h-8 w-auto mx-auto mb-8">

        {% if success %}
        <!-- SUCCESS STATE -->
        <div
            class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 mb-5 border border-emerald-100">
            <i class="fa-solid fa-check text-3xl"></i>
        </div>

        <h2 class="text-2xl font-black text-slate-800 mb-2 tracking-tight">Password Updated!</h2>
        <p class="text-slate-500 text-sm font-medium mb-8">Your account password has been successfully changed.</p>

        <a href="{{ url_for('admin_home') }}"
            class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition-colors flex items-center justify-center tracking-wide">
            <span>Go to Overview</span>
            <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
        </a>

        {% else %}
        <!-- FORM STATE -->
        <div
            class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 text-blue-600 mb-5 border border-blue-100">
            <i class="fa-solid fa-lock text-2xl"></i>
        </div>

        <h2 class="text-2xl font-black text-slate-800 mb-2 tracking-tight">Update Password</h2>
        <p class="text-slate-500 text-sm font-medium mb-8">Please set a new secure password.</p>

        {% if error %}
        <div
            class="bg-rose-50 border border-rose-200 text-rose-600 px-4 py-3 rounded-lg mb-6 text-sm font-bold flex items-start text-left">
            <i class="fa-solid fa-circle-exclamation mt-0.5 mr-2.5"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" class="text-left space-y-5">
            <!-- New Password -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-key text-slate-400"></i>
                </div>
                <input type="password" name="new_password" placeholder="New Password" required
                    class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors text-sm font-medium shadow-inner">
            </div>

            <!-- Confirm Password -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-lock text-slate-400"></i>
                </div>
                <input type="password" name="confirm_password" placeholder="Confirm Password" required
                    class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors text-sm font-medium shadow-inner">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center mt-2 tracking-wide">
                <span>Update Password</span>
                <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
            </button>
        </form>
        {% endif %}
    </div>

</body>

</html>
