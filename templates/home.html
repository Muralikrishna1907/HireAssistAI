<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Portal - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Exact Frosted Blue Glass Effect */
        .deep-blue-glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>

<body
    class="bg-[linear-gradient(135deg,#172554,#1e3a8a,#2563eb)] min-h-screen flex flex-col font-sans antialiased text-white overflow-hidden selection:bg-blue-400 relative">

    <!-- SBP Logo Watermark -->
    <div class="fixed inset-0 flex items-center justify-center pointer-events-none z-0">
        <img src="{{ url_for('static', filename='images/SBP-Logo.png') }}" alt="Watermark"
            class="w-[80vw] md:w-[50vw] max-w-[800px] opacity-[0.04] object-contain select-none">
    </div>

    <!-- Transparent Header -->
    <header class="h-20 flex items-center justify-between px-6 sm:px-10 w-full z-20 pt-4 flex-shrink-0">
        <div class="flex items-center">
            <img src="{{ url_for('static', filename='images/SBP-Logo.png') }}" alt="SBP Logo"
                class="h-10 w-auto drop-shadow-md">
            <div class="ml-5 pl-5 border-l border-white/20 hidden sm:block">
                <h1 class="text-xl font-extrabold text-white tracking-tight drop-shadow-md">Interview Portal</h1>
            </div>
        </div>
        <!-- Secure Environment badge removed from here -->
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 relative z-10 w-full">

        <!-- Frosted Blue Glass Card -->
        <div
            class="deep-blue-glass w-full max-w-md p-8 sm:p-10 rounded-2xl text-center animate-fade-in relative overflow-hidden">

            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/20 text-white mb-6 shadow-md border border-white/20">
                <i class="fa-solid fa-user-check text-2xl drop-shadow-lg"></i>
            </div>

            <!-- Highlighted Text -->
            <h2 class="text-3xl font-black tracking-tight mb-2 drop-shadow-lg text-white">Candidate Login</h2>
            <p class="text-white/90 text-sm font-semibold mb-8 drop-shadow-sm">Enter your Candidate ID to begin the
                assessment</p>

            <!-- Error Message -->
            {% if error_msg %}
            <div
                class="bg-rose-500/30 border border-rose-400/50 text-rose-50 px-4 py-3 rounded-lg mb-6 flex items-start text-sm shadow-md text-left backdrop-blur-md">
                <i class="fa-solid fa-circle-exclamation mt-0.5 mr-2.5 text-rose-300"></i>
                <span class="font-bold tracking-wide">{{ error_msg }}</span>
            </div>
            {% endif %}

            <form action="/start" method="POST" onsubmit="showLoading()" class="text-left">
                <div class="mb-6">
                    <!-- Brighter Label -->
                    <label
                        class="block text-[11px] font-extrabold text-white/90 uppercase tracking-widest mb-2 ml-1 drop-shadow-sm">Person
                        ID</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-id-badge text-white/70"></i>
                        </div>
                        <!-- High Contrast Input -->
                        <input type="text" name="person_id" placeholder="e.g. USER_001" required autocomplete="off"
                            class="w-full pl-11 pr-4 py-3.5 bg-black/25 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white/40 focus:bg-black/40 transition-all text-sm font-bold shadow-inner">
                    </div>
                </div>

                <!-- Solid White Button -->
                <button type="submit" name="topic" value="PYTHON"
                    class="w-full bg-white hover:bg-gray-100 text-blue-950 font-extrabold py-3.5 px-4 rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.2)] hover:shadow-[0_6px_20px_rgba(0,0,0,0.3)] transform hover:-translate-y-1 transition-all flex items-center justify-center mt-4 tracking-wide">
                    <span>Start Interview</span>
                    <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
                </button>
            </form>

        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay"
        class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden flex-col items-center justify-center z-50">
        <div class="deep-blue-glass p-8 rounded-2xl flex flex-col items-center max-w-sm mx-4 text-center">
            <div class="spinner mb-5"></div>
            <h3 class="text-lg font-bold text-white mb-1">Authenticating...</h3>
            <p class="text-sm font-medium text-blue-200">Checking credentials and preparing secure environment.</p>
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById("loadingOverlay").style.display = "flex";
        }
    </script>
</body>

</html>
