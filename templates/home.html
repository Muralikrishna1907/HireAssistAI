<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Portal - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .assessment-bg {
            background-image: url("{{ url_for('static', filename='images/assessment.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .spinner {
            border: 4px solid #dbeafe;
            border-top: 4px solid #0d6efd;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <!-- Global font: Aptos (Body) -->
    <style>
        html, body, button, input, select, textarea, .font-sans, .font-mono {
            font-family: Aptos, "Aptos Body", "Segoe UI", Calibri, Arial, sans-serif !important;
        }
    </style>
</head>

<body class="assessment-bg bg-blue-50/50 min-h-screen flex flex-col font-sans antialiased text-slate-800 selection:bg-blue-200">

    {% set header_title = "Interview Portal" %}
    {% include "_candidate_header.html" %}

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 w-full">

        <!-- Login Card -->
        <div class="bg-white border border-blue-100 shadow-xl shadow-blue-900/10 w-full max-w-md p-8 sm:p-10 rounded-2xl text-center">

            <h2 class="text-3xl font-black tracking-tight mb-2 text-slate-800">Candidate Login</h2>
            <p class="text-slate-500 text-sm font-semibold mb-8">Enter your Candidate ID to begin the assessment</p>

            <!-- Error Message -->
            {% if error_msg %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-lg mb-6 flex items-start text-sm text-left">
                <i class="fa-solid fa-circle-exclamation mt-0.5 mr-2.5"></i>
                <span class="font-bold">{{ error_msg }}</span>
            </div>
            {% endif %}

            <form action="/start" method="POST" onsubmit="showLoading()" class="text-left">
                <label for="person_id" class="block text-sm font-extrabold text-slate-700 mb-2">Person ID</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-id-badge text-slate-400"></i>
                    </div>
                    <input type="text" id="person_id" name="person_id" required autocomplete="off"
                        class="w-full pl-11 pr-4 py-3.5 bg-white border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm font-medium shadow-sm">
                </div>

                <button type="submit" name="topic" value="PYTHON"
                    class="w-full mt-6 bg-[#0d6efd] hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center tracking-wide">
                    <span>Start Interview</span>
                    <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
                </button>
            </form>

        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex-col items-center justify-center z-50">
        <div class="bg-white border border-blue-100 shadow-xl p-8 rounded-2xl flex flex-col items-center max-w-sm mx-4 text-center">
            <div class="spinner mb-5"></div>
            <h3 class="text-lg font-bold text-slate-800 mb-1">Authenticating...</h3>
            <p class="text-sm font-medium text-slate-500">Checking credentials and preparing secure environment.</p>
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById("loadingOverlay").style.display = "flex";
        }
    </script>
</body>

</html>
