<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Complete</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Solid Glass Effect */
        .solid-glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes pop {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-pop {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
    </style>
</head>

<body
    class="bg-[linear-gradient(135deg,#172554,#1e3a8a,#2563eb)] min-h-screen flex flex-col items-center justify-center font-sans antialiased text-white overflow-hidden selection:bg-blue-400 relative px-4">

    <!-- SBP Logo Watermark -->
    <div class="fixed inset-0 flex items-center justify-center pointer-events-none z-0">
        <img src="{{ url_for('static', filename='images/SBP-Logo.png') }}" alt="Watermark"
            class="w-[80vw] md:w-[50vw] max-w-[800px] opacity-10 object-contain select-none">
    </div>

    <!-- Transparent Header -->
    <header
        class="absolute top-0 left-0 w-full h-20 flex items-center justify-between px-6 sm:px-10 z-20 pt-4 flex-shrink-0">
        <img src="{{ url_for('static', filename='images/SBP-Logo.png') }}" alt="SBP Logo"
            class="h-12 w-auto drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]">
    </header>

    <!-- Main Content -->
    <div
        class="solid-glass w-full max-w-xl p-10 md:p-12 rounded-3xl z-10 text-center flex flex-col items-center animate-fade-in relative overflow-hidden">

        <!-- Success Icon -->
        <div
            class="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(255,255,255,0.2)] animate-pop border-4 border-emerald-400/20">
            <i class="fa-solid fa-check text-5xl text-emerald-500 drop-shadow-sm"></i>
        </div>

        <h1 class="text-4xl font-black mb-4 drop-shadow-md text-white tracking-tight">Thank You!</h1>
        <p class="text-xl font-bold text-white/90 mb-4 drop-shadow-sm">Your interview is complete.</p>

        <p class="text-white/80 text-sm leading-relaxed mb-10 font-medium tracking-wide">
            We appreciate the time and effort you’ve taken to complete this assessment. Your responses have been
            securely recorded and will be evaluated. We will get back to you shortly.
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
            <button onclick="window.location.href='/review'"
                class="bg-white hover:bg-gray-100 text-blue-950 font-bold py-3.5 px-8 rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.2)] hover:shadow-[0_6px_20px_rgba(0,0,0,0.3)] transform hover:-translate-y-1 transition-all flex items-center justify-center tracking-wide">
                <i class="fa-solid fa-file-lines mr-2"></i> Review Responses
            </button>
            <button onclick="window.location.href='https://sbpdigital.com/'"
                class="bg-black/30 hover:bg-black/50 border border-white/20 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg transition-all flex items-center justify-center tracking-wide">
                <i class="fa-solid fa-house mr-2"></i> Exit
            </button>
        </div>
    </div>
</body>

</html>
