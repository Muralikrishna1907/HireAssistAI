<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Verification</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        /* Exact Frosted Blue Glass Effect */
        .deep-blue-glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body
    class="bg-[linear-gradient(135deg,#172554,#1e3a8a,#2563eb)] h-screen flex flex-col font-sans antialiased text-white overflow-hidden selection:bg-blue-400 relative">

    <!-- SBP Logo Watermark -->
    <div class="fixed inset-0 flex items-center justify-center pointer-events-none z-0">
        <img src="{{ url_for('static', filename='images/SBP-Logo.png') }}" alt="Watermark"
            class="w-[80vw] md:w-[50vw] max-w-[800px] opacity-[0.04] object-contain select-none">
    </div>

    <!-- Transparent Header -->
    <header class="h-16 flex items-center justify-between px-6 sm:px-10 w-full z-20 pt-4 flex-shrink-0">
        <div class="flex items-center">
            <img src="{{ url_for('static', filename='images/SBP-Logo.png') }}" alt="SBP Logo"
                class="h-10 w-auto drop-shadow-md">
        </div>
    </header>

    <!-- Main Content -->
    <main
        class="flex-1 flex flex-col items-center justify-center px-4 z-10 w-full max-w-3xl mx-auto h-full max-h-full pb-6">

        <div class="text-center mb-5 mt-2">
            <h2 class="text-3xl md:text-4xl font-black tracking-tight mb-1.5 drop-shadow-lg text-white">Face
                Verification</h2>
            <p class="text-white/90 text-sm md:text-base font-semibold drop-shadow-sm">Please align your face within the
                frame to verify your identity.</p>
        </div>

        <!-- Frosted Blue Glass Card -->
        <div class="deep-blue-glass w-full p-6 md:p-8 rounded-2xl relative overflow-hidden flex flex-col items-center">

            <!-- Camera Section -->
            <div id="camera-section" class="w-full flex flex-col items-center">
                <div
                    class="relative rounded-xl overflow-hidden border-4 border-white/20 bg-black/40 shadow-inner mb-6 w-full max-w-[500px] aspect-[4/3] flex items-center justify-center backdrop-blur-sm">
                    <video id="video" autoplay muted class="w-full h-full object-cover"></video>
                </div>
                <button id="captureBtn" onclick="capture()" disabled
                    class="bg-white hover:bg-gray-100 text-blue-950 font-extrabold py-3.5 px-10 rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.2)] hover:shadow-[0_6px_20px_rgba(0,0,0,0.3)] transform hover:-translate-y-1 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none flex items-center tracking-wide">
                    <i class="fa-solid fa-camera mr-2"></i> Capture Photo
                </button>
            </div>

            <!-- Preview Section -->
            <div id="preview-section" class="w-full flex flex-col items-center hidden">
                <div class="relative rounded-xl overflow-hidden border-4 border-white/20 bg-black/40 shadow-inner mb-6 w-full max-w-[500px] aspect-[4/3] flex items-center justify-center transition-colors duration-300 backdrop-blur-sm"
                    id="canvasContainer">
                    <canvas id="canvas" class="w-full h-full object-cover"></canvas>
                </div>
                <div
                    class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4 w-full sm:w-auto justify-center">
                    <button onclick="recapture()"
                        class="bg-black/25 hover:bg-black/40 border border-white/20 text-white font-extrabold py-3.5 px-8 rounded-xl shadow-lg transition-all flex items-center justify-center tracking-wide">
                        <i class="fa-solid fa-rotate-left mr-2"></i> Recapture
                    </button>
                    <button id="submitBtn" disabled onclick="startInterview()"
                        class="bg-white hover:bg-gray-100 text-blue-950 font-extrabold py-3.5 px-8 rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.2)] hover:shadow-[0_6px_20px_rgba(0,0,0,0.3)] transform hover:-translate-y-1 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none flex items-center justify-center tracking-wide">
                        <span>Submit & Start</span> <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay"
        class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden flex-col items-center justify-center z-50">
        <div class="deep-blue-glass p-8 rounded-2xl flex flex-col items-center max-w-sm mx-4 text-center">
            <div class="spinner mb-5"></div>
            <p class="font-bold text-lg text-white">Processing Image...</p>
        </div>
    </div>

    <!-- Status Modal -->
    <div id="statusModal"
        class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center z-50">
        <div id="modalBox" class="deep-blue-glass p-8 max-w-sm w-full mx-4 text-center shadow-2xl rounded-2xl">
            <div id="statusIcon" class="text-6xl mb-4 drop-shadow-md"></div>
            <h3 id="statusMessage" class="text-xl font-black mb-6 text-white drop-shadow-sm tracking-wide"></h3>
            <button id="modalActionBtn"
                class="bg-white text-blue-950 font-extrabold py-3 px-8 rounded-xl hover:bg-gray-100 w-full transition-colors shadow-md"></button>
        </div>
    </div>

    <script>
        const video = document.getElementById("video"); const canvas = document.getElementById("canvas"); const context = canvas.getContext("2d");
        const captureBtn = document.getElementById("captureBtn"); const submitBtn = document.getElementById("submitBtn");
        const cameraSection = document.getElementById("camera-section"); const previewSection = document.getElementById("preview-section");
        const loadingOverlay = document.getElementById("loadingOverlay"); const statusModal = document.getElementById("statusModal");
        const modalBox = document.getElementById("modalBox"); const statusIcon = document.getElementById("statusIcon");
        const statusMessage = document.getElementById("statusMessage"); const modalActionBtn = document.getElementById("modalActionBtn");
        const canvasContainer = document.getElementById("canvasContainer");

        let streamRef = null; let modelsLoaded = false;

        async function loadModels() {
            await faceapi.nets.tinyFaceDetector.loadFromUri("/static/models");
            modelsLoaded = true;
            captureBtn.disabled = false;
        }
        loadModels();

        async function startCamera() {
            streamRef = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = streamRef;
        }
        startCamera();

        function showLoading(show) {
            loadingOverlay.style.display = show ? "flex" : "none";
        }

        function showStatus(success) {
            canvasContainer.classList.remove("border-emerald-400", "border-rose-400", "border-white/20");
            if (success) {
                statusIcon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
                statusMessage.innerText = "Face Detected Successfully";
                modalActionBtn.innerText = "Continue";
                modalActionBtn.onclick = closeModal;
                canvasContainer.classList.add("border-emerald-400");
            } else {
                statusIcon.innerHTML = '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>';
                statusMessage.innerText = "No Face Detected";
                modalActionBtn.innerText = "Recapture";
                modalActionBtn.onclick = () => { closeModal(); recapture(); };
                canvasContainer.classList.add("border-rose-400");
            }
            statusModal.style.display = "flex";
        }

        function closeModal() {
            statusModal.style.display = "none";
        }

        async function capture() {
            if (!modelsLoaded) return;
            showLoading(true);

            canvas.width = 640;
            canvas.height = 480;
            context.drawImage(video, 0, 0, 640, 480);

            if (streamRef) streamRef.getTracks().forEach(track => track.stop());
            cameraSection.style.display = "none";
            previewSection.style.display = "flex";

            const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 });
            const detections = await faceapi.detectAllFaces(canvas, options);
            showLoading(false);

            if (detections.length === 1) {
                submitBtn.disabled = false;
                showStatus(true);
            } else {
                submitBtn.disabled = true;
                showStatus(false);
            }
        }

        function recapture() {
            submitBtn.disabled = true;
            previewSection.style.display = "none";
            cameraSection.style.display = "flex";
            canvasContainer.classList.remove("border-emerald-400", "border-rose-400");
            canvasContainer.classList.add("border-white/20");
            startCamera();
        }

        async function startInterview() {
            if (submitBtn.disabled) return;
            showLoading(true);
            try {
                const imageData = canvas.toDataURL("image/png");
                const res = await fetch("/capture_photo", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ image: imageData })
                });
                const response = await res.json();
                if (response.status === "success") {
                    window.location.href = "/quiz";
                } else {
                    alert("Photo upload failed");
                }
            } catch (err) {
                alert("Error sending photo");
            }
            showLoading(false);
        }
    </script>
</body>

</html>
